[alembic]
# Ruta relativa a este archivo (backend/alembic.ini) hacia el paquete de
# migraciones dentro del esqueleto hexagonal.
script_location = src/infrastructure/migrations

# El formato de nombre de archivo de cada revision incluye fecha para que
# el orden cronologico sea legible a simple vista en versions/.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Zona horaria usada al generar el timestamp de arriba.
timezone = UTC

# NO se define sqlalchemy.url aqui a proposito: env.py la toma de la
# variable de entorno DATABASE_URL (COORDINACION-ENTREGA1.md, seccion 3),
# nunca hardcodeada en este archivo versionado.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
